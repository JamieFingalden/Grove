name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: 测试与打包 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 固定 v7.0.1
        with:
          persist-credentials: false

      - name: 检查工具链与版本
        id: version
        run: |
          xcodebuild -version
          swift --version
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Info.plist 版本号必须采用主版本.次版本.修订号格式"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签必须为 v$version，与 Info.plist 版本一致"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 运行测试
        run: swift test

      - name: 构建应用并验证签名与架构
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          zsh scripts/build.sh
          codesign --verify --deep --strict dist/Grove.app
          actual_arch=$(lipo -archs dist/Grove.app/Contents/MacOS/Grove)
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "::error::构建架构不符：预期 $EXPECTED_ARCH，实际 $actual_arch"
            exit 1
          fi

      - name: 打包 DMG 并生成校验文件
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          zsh scripts/make-dmg.sh
          cd dist
          asset="Grove-$VERSION-$ARCH.dmg"
          mv "Grove-$VERSION.dmg" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 固定 v7.0.1
        with:
          name: Grove-${{ steps.version.outputs.value }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: 发布 Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 固定 v8.0.1
        with:
          pattern: Grove-*
          path: dist
          merge-multiple: true

      - name: 校验并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" *.dmg *.sha256 \
            --verify-tag \
            --title "Grove $RELEASE_TAG" \
            --generate-notes
