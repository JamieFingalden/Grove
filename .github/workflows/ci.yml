name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: 测试与打包 (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 固定 v7.0.1
        with:
          persist-credentials: false

      - name: 检查工具链与版本
        id: version
        run: |
          xcodebuild -version
          swift --version
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Info.plist 版本号必须采用主版本.次版本.修订号格式"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签必须为 v$version，与 Info.plist 版本一致"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 校验 Cask 与最新发布一致
        # 发布后的手工回写（docs/release/homebrew.md 第 5 步）没有自动化；
        # 这里在下一次 push main 时校验 Casks/grove.rb 与最新 Release 一致，
        # 忘记回写会立刻被拦下，而不是 tap 静默停在旧版本。
        # 按已发布 Release 而非 tag 比对：tag 推送后、Release 建成前是
        # homebrew.md 许可的中间态，按 tag 比对会误报。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh release list --limit 1 --exclude-drafts --exclude-prereleases --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          cask=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/grove.rb)
          if [ -n "$latest" ] && [ "$cask" != "$latest" ]; then
            echo "::error::Casks/grove.rb 版本 $cask 与最新已发布版本 $latest 不一致。请按 docs/release/homebrew.md 第 5 步，用发布附件中的 grove.rb 回写 Casks/grove.rb 后重新推送。"
            exit 1
          fi

      - name: 运行测试
        run: swift test

      - name: 构建应用并验证签名与架构
        run: |
          zsh scripts/build.sh
          codesign --verify --deep --strict dist/Grove.app
          actual_arch=$(lipo -archs dist/Grove.app/Contents/MacOS/Grove)
          if [[ "$actual_arch" != "arm64" ]]; then
            echo "::error::构建架构不符：预期 arm64，实际 $actual_arch"
            exit 1
          fi

      - name: 打包 DMG 并生成校验文件
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          zsh scripts/make-dmg.sh
          cd dist
          asset="Grove-$VERSION-arm64.dmg"
          mv "Grove-$VERSION.dmg" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          read -r checksum _ < "$asset.sha256"
          sed -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$checksum\"/" \
            ../Casks/grove.rb > grove.rb
          ruby -c grove.rb

      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 固定 v7.0.1
        with:
          name: Grove-${{ steps.version.outputs.value }}-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/grove.rb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: 发布 Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 固定 v8.0.1
        with:
          pattern: Grove-*-arm64
          path: dist
          merge-multiple: true

      - name: 校验并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" *.dmg *.sha256 grove.rb \
            --verify-tag \
            --title "Grove $RELEASE_TAG" \
            --generate-notes
